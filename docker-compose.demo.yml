# Demo overlay — a public sandbox next to the production hub,
# on the same VPS and behind the same Caddy.
#
# Launch together with production:
#   docker compose -f docker-compose.prod.yml -f docker-compose.demo.yml up -d
#
# Requirements:
#   - DEMO_DOMAIN in .env (e.g. demo.example.com) with a DNS A record
#   - a demo site block in Caddyfile.prod (see docs/deploy-vps.md, "Public demo")
#
# Every visitor gets a private throwaway copy of a seeded sample family;
# idle sandboxes are dropped and the template is rebuilt daily by the app
# itself — no reset cron needed. Passwords, membership and file uploads
# stay blocked (see docs/deploy-vps.md, "Public demo").

services:
  app-demo:
    image: family-hub:prod
    build: .
    container_name: family-hub-demo
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      DEMO_MODE: "true"
    volumes:
      - ${DEMO_DATA_DIR:-/srv/family-hub/demo-data}:/data
    expose:
      - "8787"
